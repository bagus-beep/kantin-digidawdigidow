<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kantin Bu Ning - Premium Digital Canteen</title>
  <link rel="icon" href="favicon.ico">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/state.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/cart.js" defer></script>
  <script src="js/product.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <!-- Hero Banner -->
  <header class="hero-section py-12 px-4 text-center">
    <div class="glass max-w-4xl mx-auto rounded-3xl p-8 fade-in-up">
      <h1 id="headerTitle" class="text-4xl font-bold text-glow mb-6 bg-gradient-to-r from-gold to-amber-400 bg-clip-text text-transparent">
        Kantin Bu Ning Premium
      </h1>
      <p class="text-xl opacity-90 mb-12 max-w-2xl mx-auto fade-in-up">
        Makanan & Minuman Sekolah Favorit - Cepat, Aman, Digital 24/7
      </p>
      <div class="grid grid-cols-3 gap-6 max-w-lg mx-auto mb-12 fade-in-up">
        <div class="glass rounded-2xl p-6">
          <div class="text-3xl font-bold text-gold mb-2">25+</div>
          <div class="text-sm opacity-80">Produk Segar</div>
        </div>
        <div class="glass rounded-2xl p-6">
          <div class="text-3xl font-bold text-gold mb-2">🚚</div>
          <div class="text-sm opacity-80">Delivery Cepat</div>
        </div>
        <div class="glass rounded-2xl p-6">
          <div class="text-3xl font-bold text-gold mb-2">⭐ 4.9</div>
          <div class="text-sm opacity-80">Rating Siswa</div>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-6xl mx-auto px-4 pb-28 lg:pb-32 lg:px-8">
    
    <!-- Search & Filter -->
    <div class="sticky top-6 z-20 mb-8">
      <div class="flex flex-col lg:flex-row gap-4 max-w-2xl mx-auto">
        <div class="relative glass rounded-3xl p-2 ring-1 ring-white/20 hover:ring-gold/50 focus-within:ring-gold/50 transition-all">
          <input id="searchInput" type="search" placeholder="🔍 Cari Makaroni, Milo, dll..." 
            class="w-full pl-14 pr-6 py-4 rounded-2xl bg-transparent text-lg placeholder:text-white/60 focus:outline-none"
            aria-label="Search products">
        </div>
        <div id="filterBar" class="flex gap-2 overflow-x-auto pb-2 scrollbar-hide flex-nowrap snap-x snap-mandatory"></div>
      </div>
    </div>

    <!-- Products Grid -->
    <section id="grid" class="grid grid-cols-2 gap-6 md:gap-8"></section>
    <div id="noResults" class="col-span-full text-center py-24 opacity-50 hidden">
      <div class="text-7xl mb-8 mx-auto w-32 h-32 rounded-3xl glass flex items-center justify-center">
        <span class="text-4xl">🔍</span>
      </div>
      <h3 class="text-2xl font-bold mb-4">Produk Tidak Ditemukan</h3>
      <p>Coba ubah kata kunci atau filter kategori</p>
    </div>

  </main>

  <!-- Cart Modal -->
  <div id="cartModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-end lg:items-center lg:p-8" role="dialog" aria-labelledby="cart-title">
    <div class="glass w-full max-w-md mx-4 lg:max-w-lg rounded-3xl p-8 max-h-[90vh] overflow-y-auto lg:m-auto lg:max-h-none">
      <div class="flex justify-between items-center mb-8 pb-6 border-b border-white/20">
        <h2 id="cart-title" class="text-3xl font-bold text-gold">🛒 Keranjang</h2>
        <button onclick="toggleCart(false)" class="text-3xl hover:text-gold transition-colors p-2 rounded-2xl hover:bg-white/10" aria-label="Tutup keranjang">×</button>
      </div>

      <div id="cartItems" class="mb-8 space-y-4 min-h-[200px]"></div>
      
      <div id="emptyCart" class="text-center py-16 opacity-40 hidden">
        <div class="text-6xl mb-6 mx-auto w-24 h-24 rounded-2xl glass flex items-center justify-center">
          🛒
        </div>
        <h3 class="text-xl font-bold mb-3">Keranjang Kosong</h3>
        <p>Tambahkan produk dari katalog</p>
      </div>

      <!-- Upsell -->
      <div id="upsell" class="glass rounded-2xl p-6 mb-8 border border-gold/30 hidden">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-4" id="upsellContent">
            <span class="text-3xl text-gold">🔥</span>
            <div>
              <div class="font-bold text-lg" id="upsellName">Loading...</div>
              <div class="text-gold font-semibold" id="upsellPrice"></div>
            </div>
          </div>
          <button onclick="addUpsell()" id="upsellBtn" class="premium-btn px-8 py-3 text-sm font-bold disabled:opacity-50" disabled>
            + Tambah
          </button>
        </div>
      </div>

      <!-- Total & Checkout -->
      <div class="bg-gradient-to-r from-white/10 rounded-3xl p-8 space-y-6">
        <div class="flex justify-between text-2xl font-bold">
          <span>Total:</span>
          <span id="total" class="text-gold">Rp 0</span>
        </div>
        <button onclick="checkout()" id="checkoutBtn" class="w-full premium-btn text-xl py-4 font-bold shadow-2xl" disabled>
          📱 Checkout WhatsApp
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-28 left-1/2 -translate-x-1/2 bg-gold text-black px-8 py-4 rounded-3xl shadow-2xl font-semibold text-lg hidden z-60" role="status"></div>

  <!-- Bottom Navigation - Mobile Only -->
  <nav class="lg:hidden fixed bottom-0 left-0 right-0 glass backdrop-blur-xl border-t border-white/20 z-40 shadow-2xl">
    <div class="max-w-md mx-auto flex h-20 items-center justify-around px-4">
      <button onclick="goHome()" class="flex flex-col items-center gap-1 p-3 rounded-2xl hover:bg-white/10 transition-all flex-1 h-full" aria-label="Beranda">
        <span class="text-2xl">🏠</span>
        <span class="text-xs font-medium">Beranda</span>
      </button>
      <button onclick="toggleCart(true)" class="relative flex flex-col items-center gap-1 premium-btn p-4 rounded-3xl shadow-xl mx-2 flex-1 h-full" aria-label="Keranjang">
        <span class="text-2xl">🛒</span>
        <span class="text-xs font-bold">Keranjang</span>
        <span id="navCount" class="absolute -top-3 -right-3 bg-red-500 text-white text-xs px-2 py-1 rounded-full font-bold min-w-[24px] h-[24px] flex items-center justify-center shadow-lg hidden">0</span>
      </button>
      <button onclick="goTransaction()" class="flex flex-col items-center gap-1 p-3 rounded-2xl hover:bg-white/10 transition-all text-white/80 flex-1 h-full" aria-label="Transaksi">
        <span class="text-2xl">📋</span>
        <span class="text-xs font-medium">Transaksi</span>
      </button>
      <button onclick="goAccount()" class="flex flex-col items-center gap-1 p-3 rounded-2xl hover:bg-white/10 transition-all text-white/80 flex-1 h-full" aria-label="Profil">
        <span class="text-2xl">👤</span>
        <span class="text-xs font-medium">Profil</span>
      </button>
    </div>
  </nav>

</body>
</html>
