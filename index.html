<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ff8a00" />
  <title>Kantin Digital</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- App Entry -->
  <script type="module" src="js/app.js" defer></script>
</head>

<body>
  <!-- Background Layer -->
  <div class="page-chrome" aria-hidden="true">
    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>
    <div class="grid-wash"></div>
  </div>

  <!-- App Container -->
  <main class="app-shell" role="application">

    <!-- Pages Wrapper -->
    <section class="pages">

      <!-- ================= HOME ================= -->
      <section id="home" class="page active" data-page>

        <!-- Hero -->
        <header class="hero-card">
          <div class="hero-copy">
            <p class="eyebrow">Belanja cepat untuk jam istirahat sekolah</p>
            <h1 id="partnerName">Memuat kantin...</h1>
            <p id="partnerTagline" class="hero-tagline"></p>

            <div class="hero-actions">
              <button id="primaryCtaButton" class="primary-button large" type="button">
                🛒 Belanja
              </button>
              <button id="contactSellerButton" class="secondary-button" type="button">
                Hubungi
              </button>
            </div>
          </div>
        </header>

        <!-- Catalog -->
        <section class="catalog-layout">

          <header class="section-heading">
            <h2>Menu</h2>
          </header>

          <!-- Search -->
          <div class="search-panel">
            <input id="searchInput" type="search" placeholder="Cari produk..." autocomplete="off" />
          </div>

          <!-- Filters -->
          <div id="filterChips" class="filter-chips" role="tablist"></div>

          <!-- Meta -->
          <p id="resultsMeta" class="results-meta"></p>

          <!-- Products -->
          <div id="productGrid" class="product-grid" aria-live="polite"></div>

          <!-- Empty -->
          <div id="emptyState" class="empty-state hidden">
            <p>Tidak ditemukan</p>
            <button id="emptyResetButton" class="primary-button">Reset</button>
          </div>
        </section>

        <!-- Trust -->
        <section class="trust-grid">
          <article class="feature-card">
            <h3>Lokasi</h3>
            <p id="addressText"></p>
          </article>

          <article class="feature-card">
            <h3>Layanan</h3>
            <p>Checkout via WhatsApp</p>
          </article>
        </section>
      </section>

      <!-- ================= CART ================= -->
      <section id="cart" class="page" data-page>
        <header>
          <h1>Keranjang</h1>
        </header>

        <div id="cartItems" class="cart-items"></div>

        <div id="cartEmpty" class="cart-empty">
          <h3>Kosong</h3>
          <p>Tambahkan produk</p>
        </div>

        <footer class="cart-summary">
          <div class="cart-summary-row">
            <span>Total</span>
            <strong id="summaryTotal">Rp 0</strong>
          </div>

          <button id="checkoutButton" class="primary-button" disabled>
            Checkout
          </button>
        </footer>
      </section>

      <!-- ================= TRANSACTIONS ================= -->
      <section id="transactions" class="page" data-page>
        <h1>Riwayat</h1>
        <div class="transactions-list">
          <div class="transaction-card">
            <p>Belum ada transaksi</p>
          </div>
        </div>
      </section>

      <!-- ================= PROFILE ================= -->
      <section id="profile" class="page" data-page>
        <h1>Profil</h1>

        <div class="profile-grid">

          <!-- User Info -->
          <div class="profile-card">
            <h3>Pengguna</h3>

            <label>
              Nama
              <input data-key="name" class="profile-input" type="text" />
            </label>

            <label>
              Sekolah
              <input data-key="school" class="profile-input" type="text" />
            </label>

            <label>
              WhatsApp
              <input data-key="whatsapp" class="profile-input" type="tel" />
            </label>
          </div>

          <!-- Theme -->
          <div class="profile-card">
            <h3>Tema</h3>
            <label class="theme-toggle">
              <span>Light</span>
              <input type="checkbox" id="themeToggle" />
              <span>Dark</span>
            </label>
          </div>

          <!-- Settings -->
          <div class="profile-card">
            <h3>Pengaturan</h3>
            <label><input type="checkbox" /> Notifikasi</label>
            <label><input type="checkbox" /> Auto checkout</label>
          </div>

        </div>
      </section>

    </section>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav" role="navigation">
      <button class="nav-item active" data-page="home">
        <span>🏠</span>
        <small>Home</small>
      </button>

      <button class="nav-item" data-page="cart">
        <span>🛒</span>
        <small>Cart</small>
        <span id="navCartCount" class="nav-cart-badge">0</span>
      </button>

      <button class="nav-item" data-page="transactions">
        <span>📋</span>
        <small>Riwayat</small>
      </button>

      <button class="nav-item" data-page="profile">
        <span>👤</span>
        <small>Profil</small>
      </button>
    </nav>

  </main>

  <!-- Overlay -->
  <div id="cartOverlay" class="cart-overlay" hidden></div>

  <!-- Toast -->
  <div id="toast" class="toast" role="status"></div>

</body>
</html>
